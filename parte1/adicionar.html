<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="modal">
      <div class="modal-conteudo">
        <a href="index.html">&larr; Voltar</a>
        <h1 id="titulo-pagina">Adicionar filme</h1>
        <form id="form-filme">
          <label for="titulo">Título:</label>
          <input id="titulo" type="text" name="titulo" required /> <br />
          <label for="ano">Ano (1888 a 2030):</label>
          <input
            id="ano"
            type="number"
            name="ano"
            min="1888"
            max="2030"
            required
          />
          <br />
          <label for="genero">Gênero:</label>
          <input id="genero" type="text" name="genero" required /> <br />
          <label for="poster">URL do pôster</label>
          <input id="poster" type="url" name="poster" />
          <label for="status">Status:</label>
          <select id="status" name="status" required>
            <option value="assistido">Assistido</option>
            <option value="assistindo">Assistindo</option>
            <option value="quero assistir">Quero assistir</option>
          </select>
          <label for="nota">Nota (1 a 5):</label>
          <input id="nota" type="number" name="nota" min="1" max="5" required />
          <label for="comentario">Comentário:</label>
          <textarea id="comentario" name="comentario"></textarea>
          <div class="form-acoes">
            <a href="index.html">Cancelar</a>
            <button type="submit">Salvar</button>
          </div>
        </form>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
